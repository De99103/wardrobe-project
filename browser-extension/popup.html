<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Wearly</title>
<style>body{box-sizing:border-box;width:320px;margin:0;padding:22px;font:15px/1.5 Georgia,"Times New Roman",serif;background:#f6f3ee;color:#2f3133}h1{margin:0 0 10px;font-size:22px;font-weight:600;letter-spacing:.02em}p{margin:0 0 18px;color:rgba(47,49,51,.68)}label{display:block;margin-bottom:7px;font-weight:600}select{box-sizing:border-box;width:100%;min-height:42px;padding:9px 11px;border:1px solid #d8d1c7;border-radius:10px;background:#fff;color:#2f3133;font:inherit}button{width:100%;min-height:44px;margin-top:14px;padding:11px 14px;border:1px solid #2f3133;border-radius:12px;background:#2f3133;color:#f6f3ee;font:600 15px Georgia,"Times New Roman",serif;cursor:pointer}button:hover{background:#c8b8a6;color:#2f3133;border-color:#c8b8a6}#message{margin-top:14px;overflow-wrap:anywhere;color:#2f3133}</style></head>
<body><h1>Import this product</h1><p>Reads product details and image links from this tab and sends them to Wearly for analysis. Review before saving.</p>
<label for="collection">Save to</label><select id="collection"><option value="owned">My Wardrobe</option><option value="wishlist">Wishlist</option></select>
<button id="import" type="button">Import Product</button><p id="message" role="status"></p><script src="popup.js"></script></body></html>
